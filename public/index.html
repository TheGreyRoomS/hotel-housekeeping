<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGHHousekeeping APP</title>

<!-- ── PWA ─────────────────────────────────────────────── -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f4c75">
<meta name="description" content="Housekeeping and maintenance management for The Grey Hotel.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TGH Housekeeping">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0f4c75;--primary-h:#1b6ca8;--accent:#1bc5a4;
  --dirty:#ef4444;--cleaning:#f97316;--inspection:#a855f7;--clean:#22c55e;
  --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;
  --text:#1e293b;--muted:#64748b;
  --r:8px;--sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --sh-lg:0 10px 25px rgba(0,0,0,.15);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hidden{display:none!important;}

/* LOGIN */
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f4c75 0%,#1bc5a4 100%);}
.login-box{background:#fff;border-radius:16px;padding:40px 36px;width:400px;max-width:95vw;box-shadow:var(--sh-lg);}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo .hi{font-size:48px;}
.login-logo h1{font-size:22px;color:var(--primary);font-weight:700;margin-top:8px;}
.login-logo p{color:var(--muted);font-size:13px;margin-top:3px;}
.demo-hint{background:#f8fafc;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-top:18px;font-size:12px;color:var(--muted);}
.demo-hint strong{color:var(--text);display:block;margin-bottom:6px;}
.demo-table{width:100%;border-collapse:collapse;font-size:12px;}
.demo-table td{padding:3px 4px;}
.demo-table td:last-child{text-align:right;font-family:monospace;color:var(--primary);}
.demo-table tr:nth-child(even) td{background:#f8fafc;}

/* FORMS */
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 13px;border:1.5px solid var(--border);
  border-radius:var(--r);font-size:14px;color:var(--text);background:#fff;transition:border-color .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--primary);}
.fg textarea{resize:vertical;min-height:72px;}
.err{color:var(--dirty);font-size:13px;text-align:center;margin-top:8px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:var(--r);font-size:13px;font-weight:600;
  cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-h);}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border);}.btn-ghost:hover{background:var(--bg);}
.btn-danger{background:var(--dirty);color:#fff;}.btn-danger:hover{filter:brightness(.9);}
.btn-warn{background:var(--cleaning);color:#fff;}.btn-warn:hover{filter:brightness(.9);}
.btn-purple{background:var(--inspection);color:#fff;}.btn-purple:hover{filter:brightness(.9);}
.btn-green{background:var(--clean);color:#fff;}.btn-green:hover{filter:brightness(.9);}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-full{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* HEADER */
#app-header{background:var(--primary);color:#fff;height:58px;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:var(--sh-lg);}
.h-brand{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
.h-right{display:flex;align-items:center;gap:10px;font-size:13px;}
.h-role{background:rgba(255,255,255,.2);padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .3s;}
.sync-dot.syncing{background:#fbbf24;animation:pulse 1s infinite;}
.sync-dot.ok{background:#4ade80;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* NAV */
#app-nav{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.nav-tab{padding:13px 16px;font-size:14px;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s;user-select:none;}
.nav-tab:hover{color:var(--primary);}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}

/* MAIN */
#app-main{padding:20px;max-width:1300px;margin:0 auto;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{background:#fff;padding:14px 12px;border-radius:var(--r);box-shadow:var(--sh);}
.stat-val{font-size:28px;font-weight:800;}
.stat-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px;}
.sc-dirty .stat-val{color:var(--dirty);}
.sc-cleaning .stat-val{color:var(--cleaning);}
.sc-inspection .stat-val{color:var(--inspection);}
.sc-clean .stat-val{color:var(--clean);}

/* SECTION DIVIDER */
.sec-div{display:flex;align-items:center;gap:10px;margin:22px 0 14px;}
.sec-div-line{flex:1;height:1px;background:var(--border);}
.sec-div-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap;}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.item-card{background:#fff;border-radius:12px;box-shadow:var(--sh);cursor:pointer;
  transition:transform .15s,box-shadow .15s;overflow:hidden;border:2px solid transparent;}
.item-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);}
.item-card.area-card{background:#fafbff;}
.item-card.s-dirty{border-color:var(--dirty);}
.item-card.s-cleaning{border-color:var(--cleaning);}
.item-card.s-inspection{border-color:var(--inspection);}
.item-card.s-clean{border-color:var(--clean);}
.ic-top{padding:12px 14px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.ic-name{font-size:20px;font-weight:800;line-height:1.2;}
.ic-name.area-name{font-size:13px;font-weight:800;line-height:1.3;}
.ic-body{padding:0 14px 12px;}
.ic-info{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:5px;}
.ic-bar{height:3px;}
.ic-bar.s-dirty{background:var(--dirty);}
.ic-bar.s-cleaning{background:var(--cleaning);}
.ic-bar.s-inspection{background:var(--inspection);}
.ic-bar.s-clean{background:var(--clean);}
.sbadge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;flex-shrink:0;}
.sb-dirty{background:#fef2f2;color:var(--dirty);}
.sb-cleaning{background:#fff7ed;color:var(--cleaning);}
.sb-inspection{background:#faf5ff;color:var(--inspection);}
.sb-clean{background:#f0fdf4;color:var(--clean);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
  align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:580px;
  max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);}
.modal-hdr{padding:16px 20px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:#fff;z-index:1;gap:10px;}
.modal-title{font-size:16px;font-weight:700;line-height:1.3;}
.modal-close{font-size:22px;cursor:pointer;color:var(--muted);background:none;border:none;flex-shrink:0;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px;}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.sec-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;}
.msec{margin-bottom:20px;}

/* STATUS PICKER */
.status-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.sopt{padding:10px 8px;border:2px solid var(--border);border-radius:var(--r);
  cursor:pointer;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;transition:all .15s;}
.sopt-icon{font-size:20px;margin-bottom:3px;}
.sopt.sel-dirty{border-color:var(--dirty);background:#fef2f2;color:var(--dirty);}
.sopt.sel-cleaning{border-color:var(--cleaning);background:#fff7ed;color:var(--cleaning);}
.sopt.sel-inspection{border-color:var(--inspection);background:#faf5ff;color:var(--inspection);}
.sopt.sel-clean{border-color:var(--clean);background:#f0fdf4;color:var(--clean);}

/* TIMER */
.timer-box{background:var(--bg);border-radius:var(--r);padding:14px;text-align:center;margin-bottom:12px;}
.timer-val{font-size:34px;font-weight:800;font-family:monospace;color:var(--primary);}
.timer-sub{font-size:11px;color:var(--muted);margin-top:3px;}

/* PHOTOS */
.photos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.ph-thumb{aspect-ratio:1;object-fit:cover;border-radius:6px;width:100%;cursor:pointer;border:2px solid transparent;}
.ph-thumb:hover{border-color:var(--primary);}
.ph-upload{aspect-ratio:1;border:2px dashed var(--border);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);font-size:11px;gap:3px;transition:all .15s;}
.ph-upload:hover{border-color:var(--primary);color:var(--primary);}
.ph-item{position:relative;}
.ph-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;
  border:none;border-radius:50%;width:18px;height:18px;font-size:11px;
  cursor:pointer;display:none;align-items:center;justify-content:center;}
.ph-item:hover .ph-del{display:flex;}

/* ISSUES */
.issue-item{background:var(--bg);border-radius:var(--r);padding:12px 14px;
  border-left:3px solid var(--cleaning);margin-bottom:8px;}
.issue-item.resolved{border-left-color:var(--clean);opacity:.7;}
.issue-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.issue-desc{font-size:14px;font-weight:600;}
.issue-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.ibadge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.ib-open{background:#fff7ed;color:var(--cleaning);}
.ib-in_progress{background:#eff6ff;color:#3b82f6;}
.ib-resolved{background:#f0fdf4;color:var(--clean);}

/* MAINTENANCE PAGE */
.maint-card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);
  display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.src-badge{background:var(--primary);color:#fff;font-weight:700;font-size:12px;
  padding:8px 10px;border-radius:8px;min-width:56px;max-width:90px;
  text-align:center;flex-shrink:0;line-height:1.3;word-break:break-word;}
.mc-body{flex:1;min-width:0;}
.mc-title{font-size:14px;font-weight:600;margin-bottom:2px;}
.mc-meta{font-size:11px;color:var(--muted);}
.mc-acts{display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filt{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:500;
  cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--muted);transition:all .15s;}
.filt.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* HK CARDS */
.hk-card{background:#fff;border-radius:12px;padding:16px;box-shadow:var(--sh);
  margin-bottom:12px;border-left:4px solid transparent;}
.hk-card.s-dirty{border-left-color:var(--dirty);}
.hk-card.s-cleaning{border-left-color:var(--cleaning);}
.hk-card.s-inspection{border-left-color:var(--inspection);}
.hk-card.s-clean{border-left-color:var(--clean);}
.hk-card.area-hk{background:#fafbff;}
.hk-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.hk-title{font-size:18px;font-weight:800;}
.hk-acts{display:flex;gap:8px;flex-wrap:wrap;}
.hk-expand{font-size:12px;color:var(--muted);cursor:pointer;margin-top:8px;display:flex;align-items:center;gap:4px;}
.hk-expand:hover{color:var(--primary);}
.hk-det{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}

/* ADMIN TABLE */
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:var(--r);box-shadow:var(--sh);}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;padding:10px 14px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border);}
tbody td{padding:11px 14px;font-size:14px;border-bottom:1px solid var(--border);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f8fafc;}
.rb{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:800;text-transform:uppercase;}
.rb-admin{background:#faf5ff;color:var(--inspection);}
.rb-reception{background:#eff6ff;color:#3b82f6;}
.rb-housekeeper{background:#f0fdf4;color:var(--clean);}
.rb-maintenance{background:#fff7ed;color:var(--cleaning);}

/* PHOTO VIEWER */
#photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.93);
  display:flex;align-items:center;justify-content:center;z-index:400;}
.pv-img{max-width:92vw;max-height:87vh;border-radius:8px;object-fit:contain;}
.pv-close{position:fixed;top:14px;right:18px;font-size:32px;color:#fff;cursor:pointer;background:none;border:none;}
.pv-cap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.8);font-size:13px;text-align:center;padding:0 20px;}

/* TOAST */
#toasts{position:fixed;bottom:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px;}
.toast{background:#1e293b;color:#fff;padding:10px 15px;border-radius:var(--r);
  font-size:14px;box-shadow:var(--sh-lg);animation:tin .3s ease;max-width:300px;}
.toast.success{border-left:3px solid var(--clean);}
.toast.error{border-left:3px solid var(--dirty);}
.toast.info{border-left:3px solid var(--accent);}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* PAGE HEADER */
.pg-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.pg-title{font-size:20px;font-weight:800;}
.pg-sub{font-size:13px;color:var(--muted);margin-top:2px;}

/* ASSIGN GRID */
.assign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.assign-card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);}
.assign-card.area-ac{background:#fafbff;}
.ac-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:6px;}
.ac-name{font-size:15px;font-weight:800;line-height:1.3;}

/* ASSIGN CHECKBOXES */
.assign-hk-list{display:flex;flex-direction:column;gap:2px;}
.assign-hk-item{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;
  padding:5px 6px;border-radius:6px;transition:background .1s;}
.assign-hk-item:hover{background:var(--bg);}
.assign-hk-item input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--primary);}

/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:var(--muted);}
.empty .ei{font-size:48px;margin-bottom:14px;}

/* HISTORY */
.hist-date-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.hist-date-bar input[type=date]{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;color:var(--text);}
.hist-section{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden;}
.hist-section-hdr{padding:12px 16px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.hist-log-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;}
.hist-log-row:last-child{border-bottom:none;}
.hist-item-badge{background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;min-width:58px;text-align:center;}
.hist-log-body{flex:1;min-width:0;}
.hist-log-name{font-weight:700;}
.hist-log-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.hist-dur{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;}
.hist-photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;padding:12px 16px;}
.hist-photo-wrap{position:relative;}
.hist-photo-wrap img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.hist-photo-wrap img:hover{border-color:var(--primary);}
.hist-photo-meta{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* PWA */
.login-logo img{width:74px;height:auto;display:block;margin:0 auto;}
.h-logo{width:22px;height:22px;vertical-align:-5px;}
#update-bar{position:fixed;left:0;right:0;bottom:0;z-index:150;display:none;
  align-items:center;justify-content:center;gap:14px;background:var(--text);color:#fff;
  padding:11px 16px;font-size:13px;}
#update-bar.show{display:flex;}
#update-bar button{background:var(--accent);color:#06281f;border:0;border-radius:6px;
  padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}

/* LOADING OVERLAY */
#loading-screen{position:fixed;inset:0;background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;z-index:600;font-size:15px;color:var(--muted);}

/* TABLET / RESPONSIVE */
@media(max-width:768px){
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .photos-grid{grid-template-columns:repeat(3,1fr);}
  #app-main{padding:14px;}
  .h-right .h-name{display:none;}
}
@media(max-width:520px){
  .overlay{padding:0;align-items:flex-end;}
  .modal{border-radius:16px 16px 0 0;max-height:95vh;}
  .cards-grid{grid-template-columns:repeat(2,1fr);}
  .assign-grid{grid-template-columns:1fr;}
  #app-header{padding:0 12px;}
  #app-nav{padding:0 8px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="/icons/logo.png" alt="The Grey Hotel" width="74">
      <h1>Housekeeping APP</h1>
      <p>The Grey Hotel</p>
    </div>
    <div class="fg"><label>Username</label><input id="l-user" type="text" placeholder="Enter username" autocomplete="username"></div>
    <div class="fg"><label>Password</label><input id="l-pass" type="password" placeholder="Enter password" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">Sign In</button>
    <div id="l-err" class="err hidden"></div>
    <div class="demo-hint">
      <strong>Demo Accounts</strong>
      <table class="demo-table">
        <tr><td>👑 admin</td><td>admin123</td></tr>
        <tr><td>🛎 reception1 / reception2</td><td>pass123</td></tr>
        <tr><td>🧹 hk1 · hk2 · hk3</td><td>pass123</td></tr>
        <tr><td>🔧 maintenance</td><td>pass123</td></tr>
      </table>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-shell" class="hidden">
  <header id="app-header">
    <div class="h-brand"><img src="/icons/logo-white.png" alt="" class="h-logo"> <span>Housekeeping</span></div>
    <div class="h-right">
      <div class="sync-dot" id="sync-dot" title="Sync status"></div>
      <span id="h-name" class="h-name"></span>
      <span id="h-role" class="h-role"></span>
      <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.35)" onclick="doLogout()">Sign Out</button>
    </div>

</div>

  <div id="pv-cap" class="pv-cap"></div>
</div>

<div id="toasts"></div>

<!-- FILE INPUTS -->
<input type="file" id="fi-a" accept="image/*" multiple style="display:none">
<input type="file" id="fi-b" accept="image/*" multiple style="display:none">

<script>
// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
const STATUS_LABEL = {dirty:'Dirty',cleaning:'Cleaning',inspection:'Inspection',clean:'Clean'};
const STATUS_ICON  = {dirty:'🔴',cleaning:'🧹',inspection:'🔍',clean:'✅'};
const STATUS_FULL  = {dirty:'Dirty',cleaning:'Busy Cleaning',inspection:'Ready for Inspection',clean:'Inspected & Clean'};
const POLL_MS = 25000; // sync every 25 seconds

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let token         = null;
let currentUser   = null; // {id, name, role, username}
let state         = { rooms: [], areas: [], users: [], otherIssues: [], supplies: [] };
let photoCache    = {};  // keyed by String(itemId), populated on demand
let currentView   = 'overview';
let currentItemId = null;
let timerInterval = null;
let pollInterval  = null;
let photoTarget   = null; // {id, ctx:'modal'|'hk'}
let issueFilter   = 'open';

// ═══════════════════════════════════════════════════════
//  API HELPERS
// ═══════════════════════════════════════════════════════
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(opts.headers || {}),
    },
    ...(opts.body !== undefined ? { body: JSON.stringify(opts.body) } : {}),
  });
  if (res.status === 401) { doLogout(); throw new Error('Session expired — please log in'); }
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `Error ${res.status}`);
  }
  return res.json();
}

async function loadPhotosFor(id) {
  const key = String(id);
  const itemType = isAreaId(id) ? 'area' : 'room';
  try {
    const photos = await api(`/api/photos/${itemType}/${id}`);
    photoCache[key] = photos;
    return photos;
  } catch(e) {
    photoCache[key] = [];
    return [];
  }
}

function renderPhotoGrid(photos, id) {
  const did = isAreaId(id) ? `'${id}'` : id;
  return photos.map(p =>
    `<div class="ph-item"><img class="ph-thumb" src="${p.data}" onclick="viewPhoto('${p.id}',${did})"><button class="ph-del" onclick="doDelPhoto(${did},'${p.id}',event)">✕</button></div>`
  ).join('');
}

async function syncState(silent = false) {
  const dot = document.getElementById('sync-dot');
  if (dot) dot.className = 'sync-dot syncing';
  try {
    const data = await api('/api/state');
    state = data;
    if (dot) dot.className = 'sync-dot ok';
    return true;
  } catch (e) {
    if (!silent) toast('Sync error: ' + e.message, 'error');
    if (dot) dot.className = 'sync-dot';
    return false;
  }
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function isAreaId(id) { return typeof id === 'string' && id.startsWith('a'); }
function findItem(id) {
  if (isAreaId(id)) return state.areas.find(a => a.id === id);
  const n = Number(id);
  return state.rooms.find(r => r.id === n);
}
function itemName(item) { return isAreaId(item.id) ? item.name : `Room ${item.id}`; }
function getPhotos(item) { return isAreaId(item.id) ? (item.photos || []) : (item.minibarPhotos || []); }
function getUserName(id) { const u = state.users.find(u => u.id === id); return u ? u.name : '—'; }
function getHKs() { return state.users.filter(u => u.role === 'housekeeper'); }

// Returns comma-separated names of all assigned housekeepers, or null if none
function getAssignedNames(item) {
  const ids = item.assignedTo || [];
  if (!ids.length) return null;
  return ids.map(id => getUserName(id)).join(', ');
}

function isReception() { return currentUser && (currentUser.role === 'reception' || currentUser.role === 'admin'); }
function isMaint()     { return currentUser && currentUser.role === 'maintenance'; }
function isAdmin()     { return currentUser && currentUser.role === 'admin'; }
function isHK()        { return currentUser && currentUser.role === 'housekeeper'; }

function formatDur(ms) {
  if (!ms || ms < 0) return '00:00:00';
  const s = Math.floor(ms/1000)%60, m = Math.floor(ms/60000)%60, h = Math.floor(ms/3600000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtTime(ts) { return ts ? new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—'; }
function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '—'; }
function roleLabel(r) { return {admin:'Admin',reception:'Reception',housekeeper:'Housekeeper',maintenance:'Maintenance'}[r]||r; }

function loading(on) { document.getElementById('loading-screen').classList.toggle('hidden', !on); }

// ═══════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════
/* ── Session persistence ──────────────────────────────────
 * The installed app gets killed in the background all the time (iOS is
 * especially aggressive), so the token is kept in localStorage instead of
 * only in memory. The JWT still expires server-side after 12h, so a stored
 * session lapses on its own after roughly one shift, and api() drops the
 * user back to the login screen the moment the server rejects it.
 */
const SESSION_KEY = 'tgh-hk-session';

/* Only the token is stored. The name and role are read back out of the
 * token itself rather than saved alongside it, so an edited localStorage
 * entry can't hand someone an admin-looking menu, and a stored session
 * from an older build can't feed half-built objects into the UI. */
function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ token }));
  } catch (e) { /* private mode / storage full — just don't persist */ }
}

// Read the JWT payload. Signature isn't checked here — the server does that
// on every request — but the payload can't be edited without invalidating it.
function decodeToken(t) {
  try {
    const part = String(t).split('.')[1];
    if (!part) return null;
    const bytes = atob(part.replace(/-/g, '+').replace(/_/g, '/'));
    const json = decodeURIComponent(bytes.split('').map(
      (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    const p = JSON.parse(json);
    if (!p || !p.id || !p.role || !p.name) return null;
    if (p.exp && p.exp * 1000 <= Date.now()) return null; // already lapsed
    return { id: p.id, name: p.name, role: p.role, username: p.username };
  } catch (e) { return null; }
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
  catch (e) { return null; }
}

async function restoreSession() {
  const saved = loadSession();
  if (!saved || !saved.token) return;

  const user = decodeToken(saved.token);
  if (!user) { clearSession(); return; } // missing, malformed or already expired

  const errEl = document.getElementById('l-err');
  token       = saved.token;
  currentUser = user;

  try {
    loading(true);
    const ok = await syncState(true); // silent: no toast behind the login screen
    loading(false);

    if (ok) { showApp(); return; }

    if (!token) {
      // api() saw a 401 and already logged us out and cleared storage.
      errEl.textContent = 'Your session has expired — please sign in again.';
    } else {
      // Network problem, not a bad token. Keep the session for the next launch.
      errEl.textContent = "Couldn't reach the server — check your connection.";
    }
    errEl.classList.remove('hidden');
  } catch (e) {
    // Never let a bad stored session strand someone on a broken screen
    // with no way back to the login form.
    console.warn('Session restore failed:', e);
    loading(false);
    clearSession();
    token = null; currentUser = null;
    document.getElementById('app-shell').classList.add('hidden');
    document.getElementById('login-page').classList.remove('hidden');
    errEl.textContent = 'Please sign in again.';
    errEl.classList.remove('hidden');
  }
}

async function doLogin() {
  const username = document.getElementById('l-user').value.trim();
  const password = document.getElementById('l-pass').value;
  const errEl    = document.getElementById('l-err');
  const btn      = document.getElementById('login-btn');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const data = await api('/api/login', { method: 'POST', body: { username, password } });
    token       = data.token;
    currentUser = data.user;
    saveSession();
    loading(true);
    await syncState();
    loading(false);
    showApp();
  } catch (e) {
    errEl.textContent = e.message || 'Login failed';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

function doLogout() {
  token = null; currentUser = null;
  clearSession();
  clearInterval(timerInterval); clearInterval(pollInterval);
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-page').classList.remove('hidden');
  document.getElementById('l-user').value = '';
  document.getElementById('l-pass').value = '';
  document.getElementById('overlay-container').innerHTML = '';
}

document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('l-user').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ═══════════════════════════════════════════════════════
//  APP SHELL
// ═══════════════════════════════════════════════════════
function showApp() {
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  document.getElementById('h-name').textContent = currentUser.name;
  document.getElementById('h-role').textContent = roleLabel(currentUser.role);
  buildNav();
  setView(defaultView());
  // Poll for live updates
  clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    const ok = await syncState(true);
    if (ok) refreshOpenModal();
  }, POLL_MS);
}

function defaultView() {
  if (currentUser.role === 'housekeeper') return 'my-rooms';
  if (currentUser.role === 'maintenance') return 'issues';
  return 'overview';
}

function buildNav() {
  let tabs = [];
  if (currentUser.role === 'housekeeper') {
    tabs = [['my-rooms','🧹 My Work'],['all-rooms','🏨 All Spaces'],['issues','🔧 Maintenance'],['history','📅 History']];
  } else if (currentUser.role === 'maintenance') {
    tabs = [['all-rooms','🏨 All Spaces'],['issues','🔧 Maintenance'],['history','📅 History']];
  } else {
    tabs = [['overview','🏨 Overview'],['assignments','📋 Assign'],['issues','🔧 Maintenance'],['history','📅 History']];
    if (isAdmin()) tabs.push(['admin','⚙️ Users']);
  }
  document.getElementById('app-nav').innerHTML = tabs.map(([id,lbl]) =>
    `<div class="nav-tab${currentView===id?' active':''}" onclick="setView('${id}')">${lbl}</div>`
  ).join('');
}

function setView(v) { currentView = v; buildNav(); renderView(); }

function renderView() {
  clearInterval(timerInterval);
  const main = document.getElementById('app-main');
  switch (currentView) {
    case 'overview':    main.innerHTML = renderOverview();    startTimers(); break;
    case 'assignments': main.innerHTML = renderAssignments(); break;
    case 'my-rooms':    main.innerHTML = renderHKView();      startTimers(); break;
    case 'all-rooms':   main.innerHTML = renderAllSpaces();   break;
    case 'issues':      main.innerHTML = renderIssues();      break;
    case 'history':     main.innerHTML = renderHistoryShell(); loadHistory(); break;
    case 'admin':       main.innerHTML = renderAdmin();       break;
  }
}

function refreshOpenModal() {
  if (currentItemId !== null) {
    const item = findItem(currentItemId);
    if (item) openItemModal(currentItemId);
  } else {
    renderView();
  }
}

// ═══════════════════════════════════════════════════════
//  VIEWS
// ═══════════════════════════════════════════════════════

function renderOverview() {
  const all = [...state.rooms, ...state.areas];
  const cnt = s => all.filter(i => i.status === s).length;
  const issues = all.reduce((a,i) => a + i.maintenanceIssues.filter(x => x.status !== 'resolved').length, 0);
  return `
    <div class="pg-hdr">
      <div><div class="pg-title">Overview</div>
        <div class="pg-sub">${new Date().toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="doRefresh()">↺ Refresh</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--primary)">${state.rooms.length + state.areas.length}</div><div class="stat-lbl">Total</div></div>
      <div class="stat-card sc-dirty"><div class="stat-val">${cnt('dirty')}</div><div class="stat-lbl">Dirty</div></div>
      <div class="stat-card sc-cleaning"><div class="stat-val">${cnt('cleaning')}</div><div class="stat-lbl">Cleaning</div></div>
      <div class="stat-card sc-inspection"><div class="stat-val">${cnt('inspection')}</div><div class="stat-lbl">Inspection</div></div>
      <div class="stat-card sc-clean"><div class="stat-val">${cnt('clean')}</div><div class="stat-lbl">Clean</div></div>
      ${issues ? `<div class="stat-card" style="border-left:3px solid var(--cleaning)"><div class="stat-val" style="color:var(--cleaning)">${issues}</div><div class="stat-lbl">Open Issues</div></div>` : ''}
    </div>
    <div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">🛏 Rooms (${state.rooms.length})</div><div class="sec-div-line"></div></div>
    <div class="cards-grid">${state.rooms.map(r => cardHTML(r)).join('')}</div>
    <div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">🏞 Common Areas & Spaces (${state.areas.length})</div><div class="sec-div-line"></div></div>
    <div class="cards-grid">${state.areas.map(a => cardHTML(a)).join('')}</div>`;
}

function cardHTML(item) {
  const ia    = isAreaId(item.id);
  const names = getAssignedNames(item);
  const pics  = getPhotos(item).length;
  const active = item.status === 'cleaning' && item.cleaningStart;
  const dur = active ? formatDur(Date.now() - item.cleaningStart)
    : (item.cleaningStart && item.cleaningEnd ? formatDur(item.cleaningEnd - item.cleaningStart) : null);
  const did = ia ? `'${item.id}'` : item.id;
  return `
    <div class="item-card s-${item.status}${ia?' area-card':''}" onclick="openItemModal(${did})">
      <div class="ic-top">
        <div class="ic-name${ia?' area-name':''}">${ia ? `${item.icon} ${item.name}` : `Room ${item.id}`}</div>
        <div class="sbadge sb-${item.status}">${STATUS_LABEL[item.status]}</div>
      </div>
      <div class="ic-body">
        ${names ? `<div class="ic-info"><span>🧹</span>${names}</div>` : '<div class="ic-info" style="color:#cbd5e1">Unassigned</div>'}
        ${dur ? `<div class="ic-info"><span>⏱</span><span class="live-dur" data-rid="${item.id}">${dur}</span></div>` : ''}
        ${pics ? `<div class="ic-info"><span>📷</span>${pics} photo${pics>1?'s':''}</div>` : ''}
      </div>
      <div class="ic-bar s-${item.status}"></div>
    </div>`;
}

function renderAssignments() {
  const hks = getHKs();
  const card = item => {
    const ia  = isAreaId(item.id);
    const did = ia ? `'${item.id}'` : item.id;
    const names = getAssignedNames(item);
    return `
      <div class="assign-card${ia?' area-ac':''}">
        <div class="ac-top">
          <div class="ac-name">${ia ? `${item.icon} ${item.name}` : `Room ${item.id}`}</div>
          <div class="sbadge sb-${item.status}">${STATUS_LABEL[item.status]}</div>
        </div>
        <div class="sec-lbl" style="margin-bottom:6px">Housekeepers</div>
        <div class="assign-hk-list">
          ${hks.length ? hks.map(h => `
            <label class="assign-hk-item">
              <input type="checkbox" ${(item.assignedTo||[]).includes(h.id)?'checked':''}
                onchange="doAssign(${did},'${h.id}',this.checked)">
              <span>${h.name}</span>
            </label>
          `).join('') : '<div style="font-size:12px;color:var(--muted)">No housekeepers</div>'}
        </div>
        ${names ? `<div style="font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">✓ ${names}</div>` : ''}
      </div>`;
  };
  return `
    <div class="pg-hdr"><div><div class="pg-title">Assignments</div><div class="pg-sub">Assign housekeepers to rooms & areas</div></div></div>
    <div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">🛏 Rooms</div><div class="sec-div-line"></div></div>
    <div class="assign-grid">${state.rooms.map(card).join('')}</div>
    <div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">🏞 Areas & Spaces</div><div class="sec-div-line"></div></div>
    <div class="assign-grid">${state.areas.map(card).join('')}</div>`;
}

function renderHKView() {
  // Now assignedTo is an array — check inclusion
  const myRooms = state.rooms.filter(r => (r.assignedTo||[]).includes(currentUser.id));
  const myAreas = state.areas.filter(a => (a.assignedTo||[]).includes(currentUser.id));
  const total = myRooms.length + myAreas.length;
  if (!total) return `
    <div class="pg-hdr"><div class="pg-title">My Work</div></div>
    <div class="empty"><div class="ei">🛏</div><p>No rooms or areas assigned yet.<br>Check with reception.</p></div>`;
  return `
    <div class="pg-hdr"><div><div class="pg-title">My Work</div><div class="pg-sub">${total} space${total>1?'s':''} assigned to you</div></div></div>
    ${myRooms.length ? `<div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">🛏 Rooms</div><div class="sec-div-line"></div></div>${myRooms.map(hkCard).join('')}` : ''}
    ${myAreas.length ? `<div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">🏞 Areas</div><div class="sec-div-line"></div></div>${myAreas.map(hkCard).join('')}` : ''}`;
}

function hkCard(item) {
  const ia     = isAreaId(item.id);
  const did    = ia ? `'${item.id}'` : item.id;
  const active = item.status === 'cleaning' && item.cleaningStart;
  const dur    = active ? formatDur(Date.now() - item.cleaningStart)
    : (item.cleaningStart && item.cleaningEnd ? formatDur(item.cleaningEnd - item.cleaningStart) : null);
  const open   = item.maintenanceIssues.filter(i => i.status !== 'resolved');
  const sid    = String(item.id).replace(/\W/g,'_');
  return `
    <div class="hk-card s-${item.status}${ia?' area-hk':''}">
      <div class="hk-hdr">
        <div>
          <div class="hk-title">${ia ? `${item.icon} ${item.name}` : `Room ${item.id}`}</div>
          <div style="margin-top:4px"><span class="sbadge sb-${item.status}">${STATUS_FULL[item.status]}</span></div>
        </div>
        <div class="hk-acts">
          ${item.status==='dirty' ? `<button class="btn btn-warn btn-sm" onclick="doStart(${did})">▶ Start</button>` : ''}
          ${item.status==='cleaning' ? `<button class="btn btn-purple btn-sm" onclick="doEnd(${did})">⏹ Done</button>` : ''}
          ${item.status==='inspection'||item.status==='clean' ? `<div class="sbadge ${item.status==='inspection'?'sb-inspection':'sb-clean'}" style="padding:6px 10px">${item.status==='inspection'?'Awaiting Inspection':'✓ Clean'}</div>` : ''}
        </div>
      </div>
      ${active||dur ? `
        <div class="timer-box" style="margin-top:12px">
          <div class="timer-val"><span class="live-dur" data-rid="${item.id}">${active ? formatDur(Date.now()-item.cleaningStart) : dur}</span></div>
          <div class="timer-sub">${active ? '⏱ In progress' : 'Duration: '+dur}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">${active ? 'Started '+fmtTime(item.cleaningStart) : fmtTime(item.cleaningStart)+' → '+fmtTime(item.cleaningEnd)}</div>
        </div>` : ''}
      <div class="hk-expand" onclick="toggleDet('${sid}')">
        <span id="ei-${sid}">▸</span> Photos & Issues${open.length ? ` <span style="color:var(--cleaning)">(${open.length})</span>` : ''}
      </div>
      <div id="hd-${sid}" class="hk-det hidden" data-itemid="${item.id}">
        <div class="sec-lbl">📷 ${ia?'Photos':'Minibar Photos'}</div>
        <div class="photos-grid" id="ph-${sid}">
          <div style="font-size:12px;color:var(--muted);padding:6px">Loading…</div>
          <div class="ph-upload" onclick="triggerUpload(${did},'hk')"><div style="font-size:22px">📷</div><div>Add</div></div>
        </div>
        <div class="sec-lbl" style="margin-top:14px">📝 Notes</div>
        <textarea id="hk-notes-${sid}" placeholder="Add notes…" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;resize:vertical;min-height:56px;box-sizing:border-box">${item.notes||''}</textarea>
        <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="doHKNotes(${did},'${sid}')">Save Notes</button>
        <button class="btn btn-warn btn-sm" onclick="openAddIssue(${did})">+ Report Issue</button>
      </div>
    </div>`;
}

function renderAllSpaces() {
  const all = [...state.rooms, ...state.areas];
  const cnt = s => all.filter(i => i.status === s).length;
  return `
    <div class="pg-hdr"><div class="pg-title">All Spaces</div></div>
    <div class="stats-row">
      ${['dirty','cleaning','inspection','clean'].map(s=>`<div class="stat-card sc-${s}"><div class="stat-val">${cnt(s)}</div><div class="stat-lbl">${STATUS_LABEL[s]}</div></div>`).join('')}
    </div>
    <div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">🛏 Rooms</div><div class="sec-div-line"></div></div>

    <div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">🏞 Areas</div><div class="sec-div-line"></div></div>

}

function renderIssues() {
  const all = [];
  state.rooms.forEach(r => r.maintenanceIssues.forEach(i => all.push({...i, srcId:r.id, srcName:`Room ${r.id}`})));
  state.areas.forEach(a => a.maintenanceIssues.forEach(i => all.push({...i, srcId:a.id, srcName:`${a.icon} ${a.name}`})));
  (state.otherIssues||[]).forEach(i => all.push({...i, srcId:'other', srcName:`📍 ${i.locationName}`}));
  const filtered = issueFilter==='all' ? all : all.filter(i=>i.status!=='resolved');
  const open = all.filter(i=>i.status!=='resolved').length;
  return `
    <div class="pg-hdr">
      <div><div class="pg-title">Maintenance Issues</div><div class="pg-sub">${open} open</div></div>
      <button class="btn btn-warn" onclick="openAddIssueGlobal()">+ Add Issue</button>
    </div>
    <div class="filter-row">
      <div class="filt${issueFilter==='open'?' active':''}" onclick="setFilter('open')">Open (${open})</div>
      <div class="filt${issueFilter==='all'?' active':''}" onclick="setFilter('all')">All (${all.length})</div>
      ${open ? `<button class="btn btn-ghost btn-sm" style="margin-left:auto;font-size:12px" onclick="printIssues()">🖨️ Print List</button>` : ''}
    </div>
    ${!filtered.length ? `<div class="empty"><div class="ei">✅</div><p>No ${issueFilter==='open'?'open ':''}issues!</p></div>` :
      filtered.map(iss => {
        const did = (isAreaId(iss.srcId)||iss.srcId==='other') ? `'${iss.srcId}'` : iss.srcId;
        const isOpen = iss.status !== 'resolved';
        return `
        <div class="maint-card">
          ${isOpen ? `<input type="checkbox" class="iss-chk" data-id="${iss.id}" data-loc="${iss.srcName}" data-desc="${iss.description.replace(/"/g,'&quot;')}" data-by="${getUserName(iss.reportedBy)}" data-date="${fmtDate(iss.reportedAt)}" data-status="${iss.status==='in_progress'?'In Progress':'Open'}" style="margin:4px 8px 0 0;flex-shrink:0;width:16px;height:16px;cursor:pointer">` : ''}
          <div class="src-badge">${iss.srcName}</div>
          <div class="mc-body">
            <div class="mc-title">${iss.description}</div>
            <div class="mc-meta">By ${getUserName(iss.reportedBy)} · ${fmtDate(iss.reportedAt)}</div>
            ${iss.status==='resolved'?`<div class="mc-meta" style="color:var(--clean)">✓ Resolved ${fmtDate(iss.resolvedAt)}</div>`:''}
            ${iss.resolveNote?`<div class="mc-meta">Note: ${iss.resolveNote}</div>`:''}
          </div>
          <div class="mc-acts">
            <span class="ibadge ib-${iss.status}">${iss.status==='open'?'Open':iss.status==='in_progress'?'In Progress':'Resolved'}</span>
            ${(isMaint()||isReception())&&iss.status!=='resolved' ? `
              ${iss.status==='open'?`<button class="btn btn-sm" style="background:#eff6ff;color:#3b82f6;font-size:11px" onclick="doIssueStatus(${did},'${iss.id}','in_progress')">In Progress</button>`:''}
              <button class="btn btn-green btn-sm" onclick="openResolve(${did},'${iss.id}')">✓ Resolve</button>
            ` : ''}
          </div>
        </div>`;
      }).join('')}

    ${renderSupplies()}`;
}
function setFilter(f) { issueFilter = f; renderView(); }

function renderSupplies() {
  const supplies = state.supplies || [];
  const needed   = supplies.filter(s => s.status === 'needed');
  const bought   = supplies.filter(s => s.status === 'purchased');
  const canAdd   = isMaint() || isAdmin();
  const canTick  = isAdmin() || isReception();
  return `
    <div style="margin-top:24px;border-top:2px solid var(--border);padding-top:16px">
      <div class="pg-hdr" style="margin-bottom:10px">
        <div><div class="pg-title" style="font-size:16px">🛒 Supplies Needed</div><div class="pg-sub">${needed.length} item${needed.length!==1?'s':''} needed</div></div>
        ${canAdd ? `<button class="btn btn-ghost btn-sm" onclick="openAddSupply()">+ Add Item</button>` : ''}
      </div>
      ${!supplies.length ? `<div style="font-size:13px;color:var(--muted);padding:8px 0">No supplies requested.</div>` : ''}
      ${needed.map(s => `
        <div class="maint-card" style="align-items:center">
          ${canTick ? `<input type="checkbox" style="width:18px;height:18px;margin-right:10px;flex-shrink:0;cursor:pointer" onchange="doToggleSupply('${s.id}',this.checked)">` : ''}
          <div class="mc-body" style="flex:1">
            <div class="mc-title">${s.description}</div>
            <div class="mc-meta">Requested by ${s.requestedBy} · ${fmtDate(s.requestedAt)}</div>
          </div>
          ${canAdd ? `<button class="btn btn-ghost btn-sm" style="font-size:11px;color:#ef4444" onclick="doDeleteSupply('${s.id}')">✕</button>` : ''}
        </div>`).join('')}
      ${bought.length ? `
        <div style="margin-top:12px;font-size:12px;color:var(--muted);font-weight:600">PURCHASED</div>
        ${bought.map(s => `
          <div class="maint-card" style="opacity:0.5;align-items:center">
            ${canTick ? `<input type="checkbox" checked style="width:18px;height:18px;margin-right:10px;flex-shrink:0;cursor:pointer" onchange="doToggleSupply('${s.id}',this.checked)">` : ''}
            <div class="mc-body" style="flex:1;text-decoration:line-through">
              <div class="mc-title">${s.description}</div>
            </div>
            <button class="btn btn-ghost btn-sm" style="font-size:11px;color:#ef4444" onclick="doDeleteSupply('${s.id}')">✕</button>
          </div>`).join('')}
        <button class="btn btn-ghost btn-sm" style="margin-top:6px;font-size:12px" onclick="doClearPurchased()">Clear Purchased</button>
      ` : ''}
    </div>`;
}

function openAddSupply() {
  const w = document.createElement('div');
  w.id = 'supply-wrapper';
  w.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeExtra('supply-wrapper')">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
        <div class="modal-hdr"><div class="modal-title">🛒 Add Supply Item</div><button class="modal-close" onclick="closeExtra('supply-wrapper')">✕</button></div>
        <div class="modal-body">
          <div class="fg"><label>Item needed</label><textarea id="sup-desc" placeholder="e.g. Cleaning gloves, Bleach 5L…" rows="3"></textarea></div>
          <div id="sup-err" class="err hidden"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeExtra('supply-wrapper')">Cancel</button>
          <button class="btn btn-primary" onclick="doAddSupply()">Add Item</button>
        </div>
      </div>

async function doAddSupply() {
  const desc  = document.getElementById('sup-desc')?.value?.trim();
  const errEl = document.getElementById('sup-err');
  if (!desc) { errEl.textContent='Please describe the item.'; errEl.classList.remove('hidden'); return; }
  try {
    await api('/api/supplies', { method:'POST', body:{ description:desc } });
    await syncState(true);
    closeExtra('supply-wrapper');
    toast('Supply item added','info');
    renderView();
  } catch(e) { errEl.textContent=e.message; errEl.classList.remove('hidden'); }
}

async function doToggleSupply(id, checked) {
  try {
    await api(`/api/supplies/${id}`, { method:'PATCH', body:{ status: checked ? 'purchased' : 'needed' } });
    await syncState(true);
    renderView();
  } catch(e) { toast(e.message,'error'); }
}

async function doDeleteSupply(id) {
  try {
    await api(`/api/supplies/${id}`, { method:'DELETE' });
    await syncState(true);
    renderView();
  } catch(e) { toast(e.message,'error'); }
}

async function doClearPurchased() {
  const purchased = (state.supplies||[]).filter(s=>s.status==='purchased');
  try {
    await Promise.all(purchased.map(s => api(`/api/supplies/${s.id}`, { method:'DELETE' })));
    await syncState(true);
    renderView();
  } catch(e) { toast(e.message,'error'); }
}

function printIssues() {
  const checkboxes = document.querySelectorAll('.iss-chk');
  const selected = Array.from(checkboxes).filter(c => c.checked);
  const items = selected.length
    ? selected.map(c => ({ loc: c.dataset.loc, desc: c.dataset.desc, by: c.dataset.by, date: c.dataset.date, status: c.dataset.status }))
    : Array.from(checkboxes).map(c => ({ loc: c.dataset.loc, desc: c.dataset.desc, by: c.dataset.by, date: c.dataset.date, status: c.dataset.status }));
  if (!items.length) { toast('No open issues to print','info'); return; }
  const w = window.open('','_blank','width=700,height=600');
  w.document.write(`<!DOCTYPE html><html><head><title>Maintenance Tasks</title>
  <style>
    body{font-family:Arial,sans-serif;padding:28px;color:#1e293b}
    h1{font-size:20px;margin-bottom:4px}
    .sub{font-size:13px;color:#64748b;margin-bottom:20px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:#f1f5f9;text-align:left;padding:8px 10px;border:1px solid #e2e8f0;font-weight:600}
    td{padding:8px 10px;border:1px solid #e2e8f0;vertical-align:top}
    tr:nth-child(even) td{background:#f8fafc}
    .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
    .open{background:#fef3c7;color:#92400e}
    .ip{background:#eff6ff;color:#1d4ed8}
    @media print{body{padding:10px}}
  </style></head><body>
  <h1>🔧 Maintenance Task List</h1>
  <div class="sub">Printed ${new Date().toLocaleString()} · ${items.length} issue${items.length>1?'s':''}</div>
  <table>
    <tr><th>#</th><th>Location</th><th>Issue</th><th>Reported By</th><th>Date</th><th>Status</th><th>Done ✓</th></tr>
    ${items.map((it,i)=>`<tr>
      <td>${i+1}</td>

      <td>${it.desc}</td>
      <td>${it.by}</td>

      <td></td>

function openItemModal(id) {
  currentItemId = id;
  const item = findItem(id);
  if (!item) return;
  const ia    = isAreaId(id);
  const did   = ia ? `'${id}'` : id;
  const hks   = getHKs();
  const open  = item.maintenanceIssues.filter(i=>i.status!=='resolved').length;
  const active = item.status==='cleaning' && item.cleaningStart;
  const dur   = active ? formatDur(Date.now()-item.cleaningStart)
    : (item.cleaningStart&&item.cleaningEnd ? formatDur(item.cleaningEnd-item.cleaningStart) : null);

  document.getElementById('overlay-container').innerHTML = `
    <div class="overlay" id="item-overlay" onclick="if(event.target.id==='item-overlay')closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-hdr">
          <div class="modal-title">${ia?item.icon+' ':''} ${itemName(item)} <span class="sbadge sb-${item.status}" style="margin-left:6px">${STATUS_FULL[item.status]}</span></div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          ${isReception() ? `
          <div class="msec">
            <div class="sec-lbl">Status</div>
            <div class="status-opts">
              ${['dirty','cleaning','inspection','clean'].map(s=>`
                <div class="sopt${item.status===s?' sel-'+s:''}" onclick="doStatus(${did},'${s}')">
                  <div class="sopt-icon">${STATUS_ICON[s]}</div>${STATUS_FULL[s]}
                </div>`).join('')}
            </div>
          </div>
          <div class="msec">
            <div class="sec-lbl">Housekeepers</div>
            <div class="assign-hk-list">
              ${hks.length ? hks.map(h=>`
                <label class="assign-hk-item">
                  <input type="checkbox" ${(item.assignedTo||[]).includes(h.id)?'checked':''}
                    onchange="doAssign(${did},'${h.id}',this.checked)">
                  <span>${h.name}</span>
                </label>
              `).join('') : '<div style="font-size:12px;color:var(--muted)">No housekeepers</div>'}
            </div>
          </div>` : ''}
          ${dur||active ? `
          <div class="msec">
            <div class="sec-lbl">⏱ Cleaning Timer</div>
            <div class="timer-box">
              <div class="timer-val"><span class="live-dur" data-rid="${id}">${dur||'00:00:00'}</span></div>
              <div class="timer-sub">${active?'Cleaning in progress':'Completed'}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px">${fmtTime(item.cleaningStart)}${item.cleaningEnd?' → '+fmtTime(item.cleaningEnd):'→ now'}${(item.assignedTo||[]).length?' · '+getAssignedNames(item):''}</div>
            </div>
          </div>` : ''}

          <div class="msec">
            <div class="sec-lbl">Notes</div>

            <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="doNotes(${did})">Save Notes</button>

            </div>

            <button class="btn btn-warn btn-sm" onclick="openAddIssue(${did})">+ Report Issue</button>
          </div>
        </div>
      </div>
    </div>`;

async function doRefresh() {
  await syncState();
  renderView();
}

// doAssign now toggles a single user in/out of the assignedTo array
async function doAssign(id, userId, checked) {
  try {
    const type = isAreaId(id) ? 'areas' : 'rooms';
    const item = findItem(id);
    let current = [...(item.assignedTo || [])];
    if (checked) {
      if (!current.includes(userId)) current.push(userId);
    } else {
      current = current.filter(u => u !== userId);
    }
    await api(`/api/${type}/${id}`, { method:'PATCH', body:{ assignedTo: current } });
    await syncState(true);
    const updatedItem = findItem(id);
    const names = getAssignedNames(updatedItem);
    toast(names ? `${itemName(updatedItem)} → ${names}` : `${itemName(updatedItem)} unassigned`, 'info');
    renderView(); // always refresh overview cards
    if (currentItemId !== null) openItemModal(id);
  } catch(e) { toast(e.message,'error'); }
}

async function doStatus(id, status) {
  try {
    const item = findItem(id);
    const body = { status };
    if (status==='cleaning' && item.status!=='cleaning') { body.cleaningStart=Date.now(); body.cleaningEnd=null; }
    if (item.status==='cleaning' && status!=='cleaning' && !item.cleaningEnd) { body.cleaningEnd=Date.now(); }
    const type = isAreaId(id) ? 'areas' : 'rooms';
    await api(`/api/${type}/${id}`, { method:'PATCH', body });
    await syncState(true);
    toast(`${itemName(findItem(id))} → ${STATUS_FULL[status]}`, 'success');
    openItemModal(id);
  } catch(e) { toast(e.message,'error'); }
}

async function doStart(id) {
  try {
    const type = isAreaId(id) ? 'areas' : 'rooms';
    await api(`/api/${type}/${id}`, { method:'PATCH', body:{ status:'cleaning', cleaningStart:Date.now(), cleaningEnd:null } });
    await syncState(true);
    toast(`${itemName(findItem(id))}: Cleaning started ▶`, 'success');
    renderView();
  } catch(e) { toast(e.message,'error'); }
}

async function doEnd(id) {
  try {
    const type = isAreaId(id) ? 'areas' : 'rooms';
    await api(`/api/${type}/${id}`, { method:'PATCH', body:{ status:'inspection', cleaningEnd:Date.now() } });
    await syncState(true);
    toast(`${itemName(findItem(id))}: Done — ready for inspection ✓`, 'success');
    renderView();

}

async function doNotes(id) {

// ── PHOTOS ──
function triggerUpload(id, ctx) {
  photoTarget = { id, ctx };
  const fi = ctx === 'hk' ? document.getElementById('fi-a') : document.getElementById('fi-b');
  fi.value = ''; fi.click();
}

['fi-a','fi-b'].forEach(fid => {
  document.getElementById(fid).addEventListener('change', async function() {
    if (!photoTarget) return;
    const { id, ctx } = photoTarget;
    const files = Array.from(this.files);
    if (!files.length) return;
    loading(true);
    try {
      for (const file of files) {
        const data = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = e => res(e.target.result);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        const itemType = isAreaId(id) ? 'area' : 'room';
        await api('/api/photos', { method:'POST', body:{ itemType, itemId:id, data, caption:file.name } });
      }
      delete photoCache[String(id)];
      await syncState(true);
      toast(`${files.length} photo${files.length>1?'s':''} uploaded 📷`, 'success');
      if (ctx === 'modal') {
        openItemModal(id);
      } else {
        // Reload photos in-place so the HK card stays expanded
        const sid = String(id).replace(/\W/g,'_');
        const grid = document.getElementById(`ph-${sid}`);
        if (grid) {
          const did = isAreaId(id) ? `'${id}'` : id;
          loadPhotosFor(id).then(photos => {
            grid.innerHTML = renderPhotoGrid(photos, id) +
              `<div class="ph-upload" onclick="triggerUpload(${did},'hk')"><div style="font-size:22px">📷</div><div>Add</div></div>`;
          });
        } else {
          renderView();
        }
      }
    } catch(e) { toast(e.message,'error'); }
    finally { loading(false); }
  });
});

async function doSaveUser(editId) {

// ═══════════════════════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════════════════════
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function renderHistoryShell() {
  return `
    <div class="pg-hdr">
      <div><div class="pg-title">📅 History</div><div class="pg-sub">Cleaning logs, minibar photos & maintenance issues by day</div></div>
    </div>
    <div class="hist-date-bar">
      <input type="date" id="hist-date" value="${todayStr()}" max="${todayStr()}" onchange="loadHistory()">
      <button class="btn btn-ghost btn-sm" onclick="loadHistory()">↺ Load</button>
      <button class="btn btn-ghost btn-sm" onclick="loadAllIssues()">📋 All Issues Log</button>
    </div>
    <div id="hist-content"><div class="empty"><div class="ei">⏳</div><p>Loading…</p></div></div>`;
}

function getItemLabel(itemType, itemId) {
  if (itemType === 'room') return `Room ${itemId}`;
  const a = state.areas.find(a => a.id === itemId);
  return a ? `${a.icon} ${a.name}` : itemId;
}

async function loadHistory() {
  const dateEl = document.getElementById('hist-date');
  if (!dateEl) return;
  const date = dateEl.value || todayStr();
  const cont = document.getElementById('hist-content');
  if (!cont) return;
  cont.innerHTML = '<div class="empty"><div class="ei">⏳</div><p>Loading…</p></div>';
  try {
    const data = await api(`/api/history?date=${date}`);
    const { logs, photos, resolvedIssues } = data;

    // Group photos by item
    const photosByItem = {};
    photos.forEach(p => {
      const key = `${p.itemType}:${p.itemId}`;
      if (!photosByItem[key]) photosByItem[key] = [];
      photosByItem[key].push(p);
    });
    const photoKeys = Object.keys(photosByItem);

    let html = '';

    // ── Cleaning Logs ──
    html += `<div class="hist-section">
      <div class="hist-section-hdr">🧹 Cleaning Sessions (${logs.length})</div>`;
    if (!logs.length) {
      html += '<div class="hist-log-row" style="color:var(--muted);font-style:italic">No cleaning sessions recorded for this day.</div>';
    } else {
      logs.forEach(l => {
        const endTime = l.endedAt ? new Date(l.endedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—';
        const dur = l.durationMs ? formatDur(l.durationMs) : '—';
        html += `
          <div class="hist-log-row">
            <div class="hist-item-badge">${l.itemType==='room'?`Rm ${l.itemId}`:l.itemName.split(' ')[0]}</div>
            <div class="hist-log-body">
              <div class="hist-log-name">${l.itemName}</div>
              <div class="hist-log-meta">By ${l.cleanedBy||'—'} · Finished ${endTime}</div>
            </div>
            <div class="hist-dur">⏱ ${dur}</div>
          </div>`;
      });
    }
    html += '</div>';

    // ── Resolved Maintenance Issues ──
    html += `<div class="hist-section">
      <div class="hist-section-hdr">🔧 Maintenance Issues Resolved (${resolvedIssues.length})</div>`;
    if (!resolvedIssues.length) {
      html += '<div class="hist-log-row" style="color:var(--muted);font-style:italic">No issues resolved this day.</div>';
    } else {
      resolvedIssues.forEach(iss => {
        const label = getItemLabel(iss.itemType, iss.itemId);
        const resolvedTime = iss.resolvedAt ? new Date(iss.resolvedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—';
        html += `
          <div class="hist-log-row">
            <div class="hist-item-badge" style="background:var(--clean)">${label.substring(0,10)}</div>
            <div class="hist-log-body">
              <div class="hist-log-name">${iss.description}</div>
              <div class="hist-log-meta">Reported by ${iss.reportedBy||'—'} · Resolved ${resolvedTime}${iss.resolveNote?' · '+iss.resolveNote:''}</div>
            </div>
            <span class="ibadge ib-resolved">Resolved</span>
          </div>`;
      });
    }
    html += '</div>';

    // ── Minibar / Area Photos ──
    html += `<div class="hist-section">
      <div class="hist-section-hdr">📷 Photos Uploaded (${photos.length})</div>`;
    if (!photos.length) {
      html += '<div class="hist-log-row" style="color:var(--muted);font-style:italic">No photos uploaded this day.</div>';
      html += '</div>';
    } else {
      photoKeys.forEach(key => {
        const ps = photosByItem[key];
        const [type, id] = key.split(':');
        let label = type === 'room' ? `Room ${id} — Minibar` : (state.areas.find(a=>a.id===id)?.name || id);
        html += `<div style="padding:10px 16px 4px;font-size:12px;font-weight:700;color:var(--muted);border-top:1px solid var(--border)">${label}</div>
          <div class="hist-photos-grid">`;
        ps.forEach(p => {
          const t = p.uploadedAt ? new Date(p.uploadedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
          html += `<div class="hist-photo-wrap">
            <img src="${p.data}" onclick="histViewPhoto('${p.id}','${p.data}','${label}','${t}')" title="${p.caption||''}">
            <div class="hist-photo-meta">${t}${p.uploadedBy?' · '+p.uploadedBy:''}</div>
          </div>`;
        });
        html += '</div>';
      });
      html += '</div>';
    }

    cont.innerHTML = html;
  } catch(e) {
    cont.innerHTML = `<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;
  }
}

// Full issue log (all time, not date-filtered)
async function loadAllIssues() {
  const cont = document.getElementById('hist-content');
  if (!cont) return;
  cont.innerHTML = '<div class="empty"><div class="ei">⏳</div><p>Loading…</p></div>';
  try {
    const data = await api(`/api/history?date=${todayStr()}`);
    const { allIssues } = data;
    if (!allIssues || !allIssues.length) {
      cont.innerHTML = '<div class="empty"><div class="ei">✅</div><p>No maintenance issues on record.</p></div>';
      return;
    }
    let html = `<div class="hist-section">
      <div class="hist-section-hdr">🔧 All Maintenance Issues (${allIssues.length})</div>`;
    allIssues.forEach(iss => {
      const label = getItemLabel(iss.itemType, iss.itemId);
      html += `
        <div class="hist-log-row" style="align-items:flex-start;padding:12px 16px">
          <div class="hist-item-badge" style="background:${iss.status==='resolved'?'var(--clean)':iss.status==='in_progress'?'#3b82f6':'var(--cleaning)'}">${label.substring(0,10)}</div>
          <div class="hist-log-body">
            <div class="hist-log-name">${iss.description}</div>
            <div class="hist-log-meta">${label} · Reported by ${iss.reportedBy||'—'} · ${fmtDate(iss.reportedAt)}</div>
            ${iss.status==='resolved'?`<div class="hist-log-meta" style="color:var(--clean)">✓ Resolved ${fmtDate(iss.resolvedAt)}${iss.resolveNote?' — '+iss.resolveNote:''}</div>`:''}
          </div>
          <span class="ibadge ib-${iss.status}" style="margin-top:2px">${iss.status==='open'?'Open':iss.status==='in_progress'?'In Progress':'Resolved'}</span>
        </div>`;
    });
    html += '</div>';
    cont.innerHTML = html;
  } catch(e) {
    cont.innerHTML = `<div class="empty"><div class="ei">⚠️</div><p>${e.message}</p></div>`;
  }
}

function histViewPhoto(id, data, label, time) {
  document.getElementById('pv-img').src = data;
  document.getElementById('pv-cap').textContent = `${label} · ${time}`;

function toast(msg, type='info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.style.opacity='0', 3200);

<!-- ── PWA: update banner + service worker ── -->
<!-- Staff use this from a browser tab, so nothing here advertises installing.
     The manifest and icons are still served, so anyone who wants a home-screen
     icon can still add one from their browser's own menu. -->
<div id="update-bar">
  <span>A new version is available.</span>
  <button type="button" id="update-btn">Update now</button>
</div>

<script>
(function () {
  /* ── Service worker ── */
  if ('serviceWorker' in navigator) {
    // Only ever reload because the user asked to update. Reloading on any
    // controllerchange would wipe half-typed forms on first visit.
    let updateRequested = false;

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then((reg) => {
        const offerUpdate = (sw) => {
          if (!sw || !navigator.serviceWorker.controller) return;
          document.getElementById('update-bar').classList.add('show');
          document.getElementById('update-btn').onclick = () => {
            updateRequested = true;
            sw.postMessage('SKIP_WAITING');
          };
        };

        // A new version may already be sitting and waiting.
        if (reg.waiting) offerUpdate(reg.waiting);

        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed') offerUpdate(sw);
          });
        });

        // Check for a new version each time the app is brought to the front.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      }).catch((err) => console.warn('SW registration failed:', err));

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!updateRequested) return;
        updateRequested = false;
        window.location.reload();
      });
    });
  }
})();
</script>
